name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Берём код из репозитория, чтобы собрать образы из актуальных Dockerfile.
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx нужен для build-push-action и кэша слоёв между запусками.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Входим в Docker Hub по секретам репозитория.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Собираем API и публикуем тег latest.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: bjjmachine/social-post-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Собираем Streamlit-интерфейс и публикуем тег latest.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: bjjmachine/social-post-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сообщаем Dokploy, что образы обновлены и приложение можно перезапустить.
      - name: Trigger Dokploy webhook
        run: curl --fail --silent --show-error --request POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
